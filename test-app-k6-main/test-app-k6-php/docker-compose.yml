services:
  test-app-k6-php:
    container_name: test-app-k6-php
    image: test-app-k6-php:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
    mem_limit: 256m
    cpus: 1

  test-app-k6-php-nginx:
    container_name: test-app-k6-php-nginx
    image: nginx:latest
    ports:
      - "8000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - test-app-k6-php
    mem_limit: 256m
    cpus: 1
