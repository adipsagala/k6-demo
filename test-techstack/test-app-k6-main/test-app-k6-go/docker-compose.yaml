services:
  test-app-k6-go:
    container_name: test-app-k6-go
    image: test-app-k6-go:1.0.0
    build:
      context: .
    ports:
      - "8003:8003"
    environment:
      - APP_PORT=8003
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_DATABASE=test-app-k6
      - DB_USERNAME=root
      - DB_PASSWORD=secret
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - CACHE_KEY_PRODUCTS=test-app-k6:go:products_all
      - DB_MAX_OPEN_CONN=25
      - DB_MAX_IDLE_CONN=5
      - DB_MAX_CONN_LIFE_TIME=5
      - DB_MAX_IDLE_LIFE_TIME=5
    mem_limit: 256m
    cpus: 1
